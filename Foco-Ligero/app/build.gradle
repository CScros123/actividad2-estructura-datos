plugins { id 'com.android.application' }
android {
 namespace 'es.foco.next'
 compileSdk 35
 buildToolsVersion '35.0.0'
 defaultConfig { applicationId 'es.foco.next'; minSdk 26; targetSdk 35; versionCode 58; versionName '0.58-brisa-viva'; testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { release { def storePath=System.getenv('FOCO_KEYSTORE'); if(storePath) { storeFile file(storePath); storePassword System.getenv('FOCO_STORE_PASSWORD'); keyAlias System.getenv('FOCO_KEY_ALIAS') ?: 'foco'; keyPassword System.getenv('FOCO_KEY_PASSWORD') ?: System.getenv('FOCO_STORE_PASSWORD') } } }
 buildTypes {
  release {
   debuggable false
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
   if(System.getenv('FOCO_KEYSTORE')) signingConfig signingConfigs.release
  }
 }
 testOptions {
  unitTests.includeAndroidResources = true
  // Robolectric installs process-global crypto providers; isolate native Android and TLS fixtures.
  unitTests.all { forkEvery = 1; maxParallelForks = 1 }
 }
 lint { abortOnError true; checkReleaseBuilds true }
 useLibrary 'android.test.runner'
 useLibrary 'android.test.base'
 useLibrary 'android.test.mock'
}
dependencies { implementation project(':core'); testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303'; testImplementation 'org.robolectric:robolectric:4.14.1' }
